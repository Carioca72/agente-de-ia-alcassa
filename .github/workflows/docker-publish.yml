name: Docker-WAHA-Deploy

on:
  push:
    branches: [ "main", "core", "essencial" ]
  pull_request:
    branches: [ "main", "core", "essencial" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: carioca72/agente-de-ia-alcassa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_OPTIONS=--max-old-space-size=4096

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Puxa a imagem nova
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:main
            
            # Remove o container antigo se existir
            docker stop waha || true
            docker rm -f waha || true
            
            # Aguarda 2 segundos para liberar recursos
            sleep 2
            
            # Roda na porta 3001 para não conflitar com seus outros apps
            docker run -d \
              --name waha \
              --restart always \
              -p 3001:3000 \
              ghcr.io/${{ env.IMAGE_NAME }}:main
